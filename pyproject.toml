[project]
name = "cfgcaddy"
version = "0.1.8"
description = "A cli for managing user's config files"
readme = "README.md"
authors = [
    { name = "Tyler Stapler", email = "tystapler@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pathspec>=0.8.1",
    "ruamel.yaml>=0.16.12",
    "questionary>=1.9.0",
    "jinja2>=3.1.0",
    "rich>=10.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=0.940",
    "python-semantic-release>=7.26.0",
]

[project.scripts]
cfgcaddy = "cfgcaddy.__main__:main"
publish = "cfgcaddy.publish:publish"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfgcaddy"]

[tool.ruff]
# Set the line length to match Black's default
line-length = 88
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable additional rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Ignore specific rules that might conflict with existing code
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B011",  # assert False is intentional for exhaustiveness checking
    "C901",  # too complex (can be addressed incrementally)
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Line endings: auto-detect
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["cfgcaddy"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.semantic_release]
version_variable = [
    "cfgcaddy/__init__.py:__version__",
    "pyproject.toml:version"
]
branch = "master"
upload_to_pypi = true
upload_to_release = true
build_command = "pip install hatchling && pip install build && python -m build"
